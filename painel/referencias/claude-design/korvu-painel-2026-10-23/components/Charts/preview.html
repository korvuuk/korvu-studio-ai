<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><style>body{padding:24px}</style></head>
<body>
<div style="display:grid;grid-template-columns:1.4fr 1fr 0.9fr;gap:16px">
  <div class="k-card" style="padding:16px"><div class="k-card-head" style="margin-bottom:8px"><span class="k-card-title">Visualizações</span><div class="k-legend"><span><i style="background:var(--chart-1)"></i>Instagram</span><span><i style="background:var(--chart-2)"></i>Facebook</span></div></div><svg class="k-chart" id="area" width="100%" height="160" viewBox="0 0 420 160" preserveAspectRatio="none"></svg></div>
  <div class="k-card" style="padding:16px"><div class="k-card-head" style="margin-bottom:12px"><span class="k-card-title">Tokens por departamento</span></div><div id="bars" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="k-card" style="padding:16px;display:flex;flex-direction:column;gap:12px"><span class="k-card-title">Custo por modelo</span><svg class="k-chart" id="donut" width="120" height="120" viewBox="0 0 104 104"></svg>
    <div style="display:flex;align-items:center;justify-content:space-between"><span class="k-cap">Sparkline</span><svg class="k-chart" id="spark" width="120" height="28"></svg></div></div>
</div>
<script>
(function(){var NS="http://www.w3.org/2000/svg";function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
var s=document.getElementById("area"),W=420,H=160,L=28,B=20,T=6,ig=[18,22,21,27,25,31,36,34,41,39,46,52],fb=[12,13,15,14,17,16,19,18,21,20,22,24],mx=60;
function X(i){return L+i*(W-L-6)/11}function Y(v){return T+(H-B-T)*(1-v/mx)}
[0,20,40,60].forEach(function(v){el("line",{x1:L,x2:W,y1:Y(v),y2:Y(v),class:"grid"},s);el("text",{x:0,y:Y(v)+3},s).textContent=v+"K";});
var p=ig.map(function(v,i){return X(i)+","+Y(v)});el("path",{d:"M"+X(0)+","+Y(0)+"L"+p.join("L")+"L"+X(11)+","+Y(0)+"Z",class:"a1"},s);
el("path",{d:"M"+fb.map(function(v,i){return X(i)+","+Y(v)}).join("L"),class:"s2"},s);el("path",{d:"M"+p.join("L"),class:"s1"},s);
for(var i=0;i<12;i+=2)el("text",{x:X(i),y:H-4,"text-anchor":"middle"},s).textContent="S"+(i+1);
var bars=[["Produção",4.1],["Roteiro",3.2],["Estratégia",2.4],["Distribuição",1.8],["Análise",1.3]],bc=document.getElementById("bars");
bars.forEach(function(b,i){var d=document.createElement("div");d.style.cssText="display:grid;grid-template-columns:84px 1fr 36px;align-items:center;gap:8px;font-size:12px";d.innerHTML='<span class="k-ink2">'+b[0]+'</span><span style="height:10px;border-radius:3px;background:var(--surface-sunken);overflow:hidden"><i style="display:block;height:100%;width:'+(b[1]/4.5*100)+'%;background:'+(i==0?'var(--chart-1)':'var(--chart-2)')+';border-radius:3px"></i></span><b class="k-num" style="text-align:right">'+String(b[1]).replace(".",",")+'M</b>';bc.appendChild(d);});
var dn=document.getElementById("donut"),r=40,c=2*Math.PI*r,acc=0;el("circle",{cx:52,cy:52,r:r,fill:"none",stroke:"var(--surface-sunken)","stroke-width":14},dn);
[[.58,"var(--chart-2)"],[.34,"var(--chart-1)"],[.08,"var(--chart-4)"]].forEach(function(q){el("circle",{cx:52,cy:52,r:r,fill:"none",stroke:q[1],"stroke-width":14,"stroke-dasharray":(q[0]*c-2)+" "+c,"stroke-dashoffset":-acc*c,transform:"rotate(-90 52 52)"},dn);acc+=q[0];});
el("text",{x:52,y:56,"text-anchor":"middle",style:"font:700 16px var(--font-sans);fill:var(--ink)"},dn).textContent="€186";
var sp=document.getElementById("spark"),d=[12,14,13,17,16,19,18,22,21,25,24,29],pts=d.map(function(v,i){return [i*116/11+2,25-(v-12)/17*22]});el("path",{d:"M"+pts.map(function(q){return q.join(",")}).join("L"),class:"s1"},sp);el("circle",{cx:pts[11][0],cy:pts[11][1],r:2.5,class:"f1"},sp);
})();
</script>
</body>
</html>
